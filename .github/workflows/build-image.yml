name: build-image (reusable)

# Reusable build: builds the (modified) Sub2API image and pushes it to
# ghcr.io/<owner>/sub2api. Called by docker-image.yml (on push/tag) and by
# sync-upstream.yml (after merging an upstream update).
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the caller ref).
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream pins ARG GOLANG_IMAGE to an exact patch (e.g. golang:1.26.5-alpine)
      # and has shipped tags where backend/go.mod already required a newer patch.
      # The official Go images set GOTOOLCHAIN=local, so the build then dies with
      # "go.mod requires go >= X (running Y)". Derive the builder image from go.mod
      # and keep only major.minor so the newest matching patch is always used.
      - name: Resolve Go builder image from go.mod
        id: goimage
        run: |
          set -euo pipefail
          want="$(awk '/^go [0-9]/ {print $2; exit}' backend/go.mod)"
          if [ -z "$want" ]; then
            echo "::error::could not read the go directive from backend/go.mod"
            exit 1
          fi
          minor="$(printf '%s' "$want" | cut -d. -f1,2)"
          echo "image=golang:${minor}-alpine" >> "$GITHUB_OUTPUT"
          echo "go.mod wants go $want -> using golang:${minor}-alpine"

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT=${{ github.sha }}
            GOLANG_IMAGE=${{ steps.goimage.outputs.image }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org

      - name: Summary
        run: |
          echo "### Image pushed to GHCR :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
