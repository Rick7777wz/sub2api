name: Sync Upstream and Rebuild

# Weekly: merge the latest official release (Wei-Shaw/sub2api) into this fork
# while keeping local changes (the Claude OAuth client_id), then rebuild the
# GHCR image. If the merge hits a conflict the run fails and you resolve it
# locally with deploy/sync-upstream.sh.
#
# .github/workflows/ is deliberately pinned to the fork's own version: GITHUB_TOKEN
# can never create or update workflow files (there is no `workflows` permission to
# grant), so carrying upstream's workflow changes would make every push -- and thus
# every sync -- fail. The fork builds through its own build-image.yml, so upstream's
# CI definitions are not needed here.
on:
  schedule:
    # Every Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - name: Checkout fork (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge latest upstream release
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          UPSTREAM="https://github.com/Wei-Shaw/sub2api.git"
          LATEST="$(git ls-remote --tags --refs --sort=-v:refname "$UPSTREAM" 'v*' \
            | head -n1 | awk -F/ '{print $NF}')"
          if [ -z "$LATEST" ]; then
            echo "no upstream tag found; skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "latest upstream tag: $LATEST"

          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch upstream tag "$LATEST" --no-tags

          BEFORE="$(git rev-parse HEAD)"

          if ! git merge --no-edit "$LATEST"; then
            UNMERGED="$(git diff --name-only --diff-filter=U)"
            if [ -z "$UNMERGED" ]; then
              echo "::error::merge of $LATEST failed with no unmerged paths"
              git merge --abort || true
              exit 1
            fi
            OUTSIDE="$(printf '%s\n' "$UNMERGED" | grep -v '^$' | grep -v '^\.github/workflows/' || true)"
            if [ -n "$OUTSIDE" ]; then
              echo "::error::merge conflict outside .github/workflows with $LATEST. Resolve locally via deploy/sync-upstream.sh:"
              printf '%s\n' "$OUTSIDE"
              git merge --abort || true
              exit 1
            fi
            for f in $UNMERGED; do
              git checkout --ours -- "$f" 2>/dev/null && git add -- "$f" \
                || git rm -q --ignore-unmatch -- "$f"
            done
            git commit --no-edit
          fi

          AFTER="$(git rev-parse HEAD)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "already up to date with $LATEST"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet "$BEFORE" HEAD -- .github/workflows/; then
            echo "pinning .github/workflows/ back to the fork version"
            git checkout "$BEFORE" -- .github/workflows
            for f in $(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- .github/workflows/); do
              git rm -q --ignore-unmatch -- "$f"
            done
            git commit --amend --no-edit
          fi

          git push origin main
          echo "merged $LATEST and pushed"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  rebuild:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      ref: main
